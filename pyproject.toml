[project]
name = "aib-reader"
version = "0.0.1"
description = "Self-owned RSS aggregation substrate for the ASTGL ecosystem (library + local-stdio MCP server)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "James Cruce", email = "jmeg8r@jmeg8r.com" }]
keywords = ["rss", "feeds", "aggregation", "mcp", "astgl"]

dependencies = [
    "typer>=0.12",        # CLI: fetch / list / search / doctor
    "pydantic>=2.7",      # Item / Feed / query models (the contract types)
    "feedparser>=6.0",    # tolerant RSS/Atom parsing
    "rapidfuzz>=3.9",     # fuzzy title dedup
    "httpx>=0.27",        # async fetch with conditional GET
    "pyyaml>=6.0",        # config/feeds.yaml (the canonical feed list)
    "python-dateutil>=2.9", # robust date parsing (timezone footguns)
    "mcp>=1.2",           # MCP server SDK (imported only by mcp_server.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
# Library CLI. `app` is a typer.Typer() instance (callable as a console entry).
aib-reader = "aib_reader.cli:app"
# MCP stdio server entry point (registered in ~/.claude.json).
aib-reader-mcp = "aib_reader.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aib_reader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
